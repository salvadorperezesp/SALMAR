[project]
name = "salmar-flight-predictor"
version = "1.0.0"
description = "Sistema Predictivo de Retrasos Aéreos con IA"
authors = [{ name = "Salvador Pérez/ María Juliá" }]
requires-python = ">=3.10"

dependencies = [
    "streamlit==1.57.0",
    "pandas==2.0.3",
    "joblib==1.5.3",
    "scikit-learn==1.8.0",
    "plotly==6.7.0",
    "numpy==1.23.5",
    "pyarrow==14.0.2",
    "dask==2024.5.0",
    "siuba==0.4.4",
    "openpyxl==3.1.5"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"